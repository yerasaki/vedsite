    <script>
        const API_BASE = 'https://api.vedsite.com/api';

        // UTILITY FUNCTIONS

        function formatTime(ms) {
            const seconds = Math.floor(ms / 1000);
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function ratingToStars(rating) {
            if (!rating) return 'No rating';
            const full = Math.floor(rating);
            const half = (rating - full) >= 0.5 ? '½' : '';
            const empty = 5 - full - (half ? 1 : 0);
            return '★'.repeat(full) + half + '☆'.repeat(empty);
        }
        
        // NOW PLAYING - Synced progress tracking

        let currentTrack = {
            name: null,
            duration: 0,
            progress: 0,
            isPlaying: false,
            lastUpdate: Date.now()
        };

        // null until fetchNowPlaying determines mode. Keeps fetchQueue from racing
        // the first paint and writing stale empty-state text into the grid.
        let displayMode = null;

        function setMode(mode) {
            if (displayMode === mode) return;
            displayMode = mode;
            const np = document.getElementById('np-header');
            const qh = document.getElementById('queue-header');
            const playStatus = document.getElementById('play-status');

            // Progress bar stays visible in both modes so the card keeps the same
            // vertical height — and so a returning visitor sees the frozen progress.
            if (mode === 'paused') {
                np.textContent = 'last played';
                qh.textContent = 'recently played';
                playStatus.textContent = '⏸︎ Paused';
            } else {
                np.textContent = 'now playing';
                qh.textContent = 'current queue';
                playStatus.textContent = '⏯︎ Playing';
            }
        }

        async function fetchNowPlaying() {
            try {
                const res = await fetch(`${API_BASE}/spotify/now-playing`);
                const data = await res.json();

                if (data.error) {
                    document.getElementById('track-name').textContent = 'Could not load';
                    pollInterval = 5000; // back off to 5s on error
                    return;
                }

                // Stay at 1s while page is active
                pollInterval = 1000;

                const prevMode = displayMode;
                setMode(data.is_playing ? 'playing' : 'paused');

                // Card always reflects the track currently in the player —
                // when playing, that's the live track; when paused, that's the
                // track you stopped on (not the one before it).
                const trackChanged = currentTrack.name !== data.track_name;
                currentTrack = {
                    name: data.track_name,
                    duration: data.duration_ms,
                    progress: data.progress_ms,
                    isPlaying: data.is_playing,
                    lastUpdate: Date.now()
                };
                if (trackChanged) {
                    document.getElementById('album-art').src = data.album_image;
                    document.getElementById('track-name').textContent = data.track_name;
                    document.getElementById('artist-name').textContent = data.artist_name;
                    document.getElementById('progress-duration').textContent = formatTime(data.duration_ms);
                }
                updateProgressUI();

                // In paused mode, the queue slot becomes the 4 songs played *before*
                // the paused track. Pass the paused track in so we can dedupe against it.
                // Only re-fetch when we just entered paused mode or the paused track
                // changed — the recent-tracks endpoint does a Spotify lookup per song,
                // so we don't want to hammer it on every 1s poll.
                if (!data.is_playing) {
                    if (prevMode !== 'paused' || trackChanged) {
                        await renderRecentlyPlayed(data.track_name, data.artist_name);
                    }
                    return;
                }

            } catch (err) {
                console.error('Error fetching now playing:', err);
                pollInterval = 5000; // Back off to 5s on error
            }
        }

        async function renderRecentlyPlayed(skipName, skipArtist) {
            try {
                const res = await fetch(`${API_BASE}/lastfm/recent-tracks`);
                const data = await res.json();
                const tracks = data.tracks || [];
                if (tracks.length === 0) return;

                // Dedupe by name+artist preserving order, and skip the currently-
                // paused track so the card and queue never duplicate.
                const seen = new Set();
                if (skipName) seen.add(`${skipName}__${skipArtist}`);
                const unique = [];
                for (const t of tracks) {
                    const key = `${t.track_name}__${t.artist_name}`;
                    if (!seen.has(key)) {
                        seen.add(key);
                        unique.push(t);
                    }
                }

                // First 4 unique tracks are the songs played *before* the paused one.
                const slots = Array.from({ length: 4 }, (_, i) => unique[i] || null);
                const container = document.getElementById('queue-list');
                container.innerHTML = slots.map(track => track ? `
                    <div class="queue-item">
                        <img src="${track.album_image}" alt="Album">
                        <div class="queue-item-info">
                            <div class="queue-track">${track.track_name}</div>
                            <div class="queue-artist">${track.artist_name}</div>
                        </div>
                    </div>
                ` : `
                    <div class="queue-item queue-item-empty">
                        <div class="queue-item-info">
                            <div class="queue-track">—</div>
                            <div class="queue-artist">empty</div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Error fetching recently played:', err);
            }
        }

        function updateProgressUI() {
            if (!currentTrack.name) return;

            // Calculate current progress based on time elapsed since last API update
            let displayProgress = currentTrack.progress;

            if (currentTrack.isPlaying) {
                const elapsed = Date.now() - currentTrack.lastUpdate;
                displayProgress = currentTrack.progress + elapsed;
            }

            // Clamp to duration
            displayProgress = Math.min(displayProgress, currentTrack.duration);

            const percent = (displayProgress / currentTrack.duration) * 100;
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-current').textContent = formatTime(displayProgress);
        }

        // Update progress display every 100ms for smooth animation
        setInterval(updateProgressUI, 100);

        // Visibility-aware polling with dynamic interval
        let nowPlayingInterval;
        let queueInterval;
        let pollInterval = 1000; // 1s when page is active 

        function startPolling() {
            fetchNowPlaying();
            fetchQueue();
            scheduleNowPlaying();
            queueInterval = setInterval(fetchQueue, 1000);
        }

        function scheduleNowPlaying() {
            clearInterval(nowPlayingInterval);
            nowPlayingInterval = setInterval(() => {
                fetchNowPlaying();
                scheduleNowPlaying(); // Reschedule with potentially new interval
            }, pollInterval);
        }

        function stopPolling() {
            clearInterval(nowPlayingInterval);
            clearInterval(queueInterval);
        }

        document.addEventListener('visibilitychange', () => {
            document.hidden ? stopPolling() : startPolling();
        });

        // =============================================================================
        // QUEUE
        // =============================================================================

        async function fetchQueue() {
            // Only render the live queue once we know we're in playing mode.
            // While paused (or before mode is determined), fetchNowPlaying owns the grid.
            if (displayMode !== 'playing') return;
            try {
                const res = await fetch(`${API_BASE}/spotify/queue`);
                const data = await res.json();

                const container = document.getElementById('queue-list');

                if (!data.queue || data.queue.length === 0) {
                    container.innerHTML = '<p class="muted-note"> no playback therefore no queue</p>';
                    return;
                }

                const slots = Array.from({ length: 4 }, (_, i) => data.queue[i] || null);
                container.innerHTML = slots.map((track, i) => track ? `
                    <div class="queue-item">
                        <img src="${track.album_image}" alt="Album">
                        <div class="queue-item-info">
                            <div class="queue-track">${track.track_name}</div>
                            <div class="queue-artist">${track.artist_name}</div>
                        </div>
                    </div>
                ` : `
                    <div class="queue-item queue-item-empty">
                        <div class="queue-item-info">
                            <div class="queue-track">—</div>
                            <div class="queue-artist">empty</div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Error fetching queue:', err);
                document.getElementById('queue-list').innerHTML = '<p class="muted-note">Queue unavailable</p>';
            }
        }

        // =============================================================================
        // TOP ARTISTS (Last.fm)
        // =============================================================================

        async function fetchTopArtists() {
            try {
                const res = await fetch(`${API_BASE}/lastfm/top-artists`);
                const data = await res.json();

                const container = document.getElementById('artists-grid');

                if (!data.artists || data.artists.length === 0) {
                    container.innerHTML = '<p>No data</p>';
                    return;
                }

                container.innerHTML = data.artists.map((artist, i) => `
                    <a href="${artist.url}" target="_blank" class="artist-card card-link">
                        ${artist.image ? `<img class="artist-img" src="${artist.image}" alt="${artist.name}">` : `<div class="rank">#${i + 1}</div>`}
                        <div class="name">${artist.name}</div>
                        <div class="plays">${artist.playcount} plays</div>
                    </a>
                `).join('');
            } catch (err) {
                console.error('Error fetching artists:', err);
            }
        }

        // =============================================================================
        // RECENT FILMS (Letterboxd)
        // =============================================================================

        async function fetchRecentFilms() {
            try {
                const res = await fetch(`${API_BASE}/letterboxd/recent`);
                const data = await res.json();

                const container = document.getElementById('films-grid');

                if (!data.films || data.films.length === 0) {
                    container.innerHTML = '<p>No films</p>';
                    return;
                }

                container.innerHTML = data.films.map(film => `
                    <a href="${film.url}" target="_blank" class="film-card card-link">
                        <img src="${film.poster}" alt="${film.title}">
                        <div class="title">${film.title}</div>
                        <div class="rating">${ratingToStars(film.rating)}</div>
                        <div class="year">${film.year}</div>
                    </a>
                `).join('');
            } catch (err) {
                console.error('Error fetching films:', err);
            }
        }

        // =============================================================================
        // TOP 4 FILMS (Letterboxd)
        // =============================================================================

        async function fetchTop4() {
            try {
                const res = await fetch(`${API_BASE}/letterboxd/top4`);
                const data = await res.json();

                const container = document.getElementById('top4-grid');

                if (!data.films || data.films.length === 0) {
                    container.innerHTML = '<p>No films</p>';
                    return;
                }

                // Generate 8 fader images for the hover animation
                const faders = (poster, title) => Array(8).fill(0).map(() => 
                    `<img class="top4-fader top4-image" src="${poster}" alt="${title}">`
                ).join('');

                container.innerHTML = data.films.map(film => `
                    <a href="${film.url}" target="_blank" class="top4-card">
                        <div class="top4-poster-wrapper">
                            <img class="top4-front-image top4-image" src="${film.poster}" alt="${film.title}">
                            <div class="top4-faders">${faders(film.poster, film.title)}</div>
                        </div>
                        <div class="title">${film.title}</div>
                        <div class="year">${film.year}</div>
                    </a>
                `).join('');
            } catch (err) {
                console.error('Error fetching top 4:', err);
            }
        }


        // =============================================================================
        // STRAVA (recent activities)
        // =============================================================================

        function formatDuration(seconds) {
            if (!seconds && seconds !== 0) return '—';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            return h > 0 ? `${h}h ${m}m` : `${m}m`;
        }

        function to12Hour(date) {
            let hours = date.getHours();
            const minutes = date.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            return `${hours}:${minutes} ${ampm}`;
        }

        function formatActivityDate(startLocal) {
            // start_date_local is the activity's wall-clock time in its own TZ,
            // even though the string carries a trailing 'Z'. Strip it.
            if (!startLocal) return '';
            const d = new Date(startLocal.replace(/Z$/, ''));
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return `${months[d.getMonth()]} ${d.getDate()}`;
        }

        function formatActivityTimeRange(startLocal, elapsedSeconds) {
            if (!startLocal) return '';
            const start = new Date(startLocal.replace(/Z$/, ''));
            const end = new Date(start.getTime() + (elapsedSeconds || 0) * 1000);
            return `${to12Hour(start)} - ${to12Hour(end)}`;
        }

        // Calligraphic ink composition per card: a burst of rays anchored at one
        // corner, a flowing variable-width brush stroke arcing across, a rust
        // spiral curl, and fine specks. Each card's anchor corner rotates around
        // the 2x2 grid so the four bursts point inward.
        function stravaInk(act, index) {
            const ORANGE = '#fc4c02';
            const RUST   = 'rgba(255, 255, 255, 0.55)';

            const seedSrc = (act.name || '') + (act.start_date_local || '') + index;
            const seed = seedSrc.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
            const rand = (i) => {
                const x = Math.sin(seed + i * 17.31) * 10000;
                return x - Math.floor(x);
            };

            // Anchor corner + angular sector the burst fans into.
            const corners = [
                { x: 16, y: 80, a0: -Math.PI / 2 - 0.15, a1: 0 + 0.15 },        // BL → up-right
                { x: 84, y: 80, a0:  Math.PI - 0.15,     a1: 3 * Math.PI / 2 + 0.15 }, // BR → up-left
                { x: 16, y: 20, a0:  0 - 0.15,           a1: Math.PI / 2 + 0.15 },    // TL → down-right
                { x: 84, y: 20, a0:  Math.PI / 2 - 0.15, a1: Math.PI + 0.15 },        // TR → down-left
            ];
            const anchor = corners[index % 4];

            // ---- Sun-burst rays ----
            const rayCount = 10 + Math.floor(rand(1) * 4);
            const rays = [];
            for (let i = 0; i < rayCount; i++) {
                const t = i / (rayCount - 1);
                const ang = anchor.a0 + t * (anchor.a1 - anchor.a0) + (rand(i + 2) - 0.5) * 0.08;
                const len = 12 + rand(i + 30) * 26;
                const gap = 2 + rand(i + 60) * 2;
                const x1 = anchor.x + Math.cos(ang) * gap;
                const y1 = anchor.y + Math.sin(ang) * gap;
                const x2 = anchor.x + Math.cos(ang) * (gap + len);
                const y2 = anchor.y + Math.sin(ang) * (gap + len);
                const sw = 0.35 + rand(i + 90) * 0.9;
                const op = 0.55 + rand(i + 120) * 0.35;
                rays.push(`<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="${ORANGE}" stroke-width="${sw.toFixed(2)}" stroke-linecap="round" opacity="${op.toFixed(2)}"/>`);
            }

            // ---- Main flowing brush stroke (filled, variable-width) ----
            const launchAng = anchor.a0 + (anchor.a1 - anchor.a0) * (0.35 + rand(200) * 0.3);
            const sx = anchor.x + Math.cos(launchAng) * 10;
            const sy = anchor.y + Math.sin(launchAng) * 10;
            const ex = anchor.x < 50 ? 65 + rand(201) * 28 : 7 + rand(201) * 28;
            const ey = anchor.y < 50 ? 65 + rand(202) * 28 : 7 + rand(202) * 28;
            const dx = ex - sx, dy = ey - sy;
            const segLen = Math.hypot(dx, dy) || 1;
            const px = -dy / segLen, py = dx / segLen;
            const bow1 = (12 + rand(203) * 14) * (rand(204) > 0.5 ? 1 : -1);
            const bow2 = (12 + rand(205) * 14) * (rand(206) > 0.5 ? -1 : 1);
            const c1x = sx + dx * 0.30 + px * bow1;
            const c1y = sy + dy * 0.30 + py * bow1;
            const c2x = sx + dx * 0.70 + px * bow2;
            const c2y = sy + dy * 0.70 + py * bow2;

            const N = 48;
            const samples = [];
            for (let i = 0; i <= N; i++) {
                const t = i / N;
                const mt = 1 - t;
                const x = mt*mt*mt*sx + 3*mt*mt*t*c1x + 3*mt*t*t*c2x + t*t*t*ex;
                const y = mt*mt*mt*sy + 3*mt*mt*t*c1y + 3*mt*t*t*c2y + t*t*t*ey;
                samples.push({ x, y });
            }
            const peak = 0.32 + rand(220) * 0.18;
            const maxW = 2.2 + rand(221) * 0.8;
            const widthAt = (t) => {
                const d = t < peak ? (peak - t) / peak : (t - peak) / (1 - peak);
                return Math.max(0, maxW * (1 - d * d));
            };
            const left = [], right = [];
            for (let i = 0; i < samples.length; i++) {
                const t = i / (samples.length - 1);
                const w = widthAt(t);
                const prev = samples[Math.max(0, i - 1)];
                const next = samples[Math.min(samples.length - 1, i + 1)];
                const tx = next.x - prev.x;
                const ty = next.y - prev.y;
                const tl = Math.hypot(tx, ty) || 1;
                const nx = -ty / tl, ny = tx / tl;
                left.push(`${(samples[i].x + nx * w).toFixed(2)},${(samples[i].y + ny * w).toFixed(2)}`);
                right.push(`${(samples[i].x - nx * w).toFixed(2)},${(samples[i].y - ny * w).toFixed(2)}`);
            }
            const brushD = `M${left.join(' L')} L${right.reverse().join(' L')} Z`;
            const brush = `<path d="${brushD}" fill="${ORANGE}" opacity="0.92"/>`;

            // ---- Rust spiral curl ~2/3 along the flow ----
            const curlT = 0.55 + rand(300) * 0.25;
            const curlIdx = Math.floor(curlT * samples.length);
            const cx = samples[curlIdx].x;
            const cy = samples[curlIdx].y;
            const curlDir = rand(301) > 0.5 ? 1 : -1;
            let spiralD = '';
            const turns = 1.4 + rand(302) * 0.5;
            const spiralSteps = 32;
            const spiralR = 3.8 + rand(303) * 1.6;
            for (let i = 0; i <= spiralSteps; i++) {
                const t = i / spiralSteps;
                const a = t * turns * Math.PI * 2 * curlDir + rand(304) * Math.PI * 2;
                const r = t * spiralR;
                const x = cx + Math.cos(a) * r;
                const y = cy + Math.sin(a) * r;
                spiralD += (i === 0 ? 'M' : 'L') + x.toFixed(2) + ',' + y.toFixed(2);
            }
            const spiral = `<path d="${spiralD}" fill="none" stroke="${RUST}" stroke-width="0.85" stroke-linecap="round" opacity="0.78"/>`;

            // ---- Fine specks scattered along the flow ----
            const dotCount = 4 + Math.floor(rand(400) * 3);
            const dots = [];
            for (let i = 0; i < dotCount; i++) {
                const t = 0.12 + i * (0.7 / dotCount) + rand(400 + i) * 0.06;
                const s = samples[Math.min(samples.length - 1, Math.floor(t * samples.length))];
                const ox = (rand(450 + i) - 0.5) * 5;
                const oy = (rand(470 + i) - 0.5) * 5;
                const r = 0.4 + rand(490 + i) * 0.7;
                const op = 0.45 + rand(510 + i) * 0.3;
                dots.push(`<circle cx="${(s.x + ox).toFixed(1)}" cy="${(s.y + oy).toFixed(1)}" r="${r.toFixed(2)}" fill="${ORANGE}" opacity="${op.toFixed(2)}"/>`);
            }

            return `<svg class="strava-ink" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
                ${rays.join('')}
                ${brush}
                ${spiral}
                ${dots.join('')}
            </svg>`;
        }

        async function fetchStrava() {
            try {
                const res = await fetch(`${API_BASE}/strava/recent`);
                const data = await res.json();

                const container = document.getElementById('strava-list');

                if (data.error || !Array.isArray(data) || data.length === 0) {
                    container.innerHTML = '<p class="muted-note">No recent activities</p>';
                    return;
                }

                container.innerHTML = data.map((act, i) => {
                    const mins = act.moving_time ? Math.round(act.moving_time / 60) : null;
                    const cal = act.calories != null ? Math.round(act.calories) : null;
                    return `
                    <a href="${act.activity_url}" target="_blank" class="strava-card">
                        ${stravaInk(act, i)}
                        <div class="strava-title">${act.name}</div>
                        <div class="strava-marginal">
                            ${formatActivityDate(act.start_date_local)} &nbsp;·&nbsp; ${formatActivityTimeRange(act.start_date_local, act.elapsed_time)}
                        </div>
                        <div class="strava-numerals">
                            <span class="num">${mins != null ? mins : '—'}<small>min</small></span>
                            <span class="num">${cal != null ? cal : '—'}<small>cal</small></span>
                        </div>
                    </a>`;
                }).join('');
            } catch (err) {
                console.error('Error fetching strava:', err);
                document.getElementById('strava-list').innerHTML = '<p class="muted-note">Strava unavailable</p>';
            }
        }

        // INITIALIZE

        document.addEventListener('DOMContentLoaded', () => {
            fetchTopArtists();    // 5 min
            fetchRecentFilms();    // 1 min (changes when you log)
            fetchTop4();          // 10 min
            fetchStrava();        // recent activities
            startPolling();
        });
    </script>
</body>

</html>
