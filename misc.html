<!DOCTYPE HTML>
<html lang='en'>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="frontend/shared.css" />
    <link rel="stylesheet" href="frontend/subpage/subpage.css" />
    <title>misc</title>
    <link rel="icon" type="image/png" href="/icons/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/icons/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="vedsite" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="frontend/misc.css" />
</head>

<body>
    <div id="background-animation">
        <div class="bg-shape triangle"></div>
        <div class="bg-shape triangle-reverse"></div>
        <div class="bg-shape triangle"></div>
        <div class="bg-shape triangle-reverse"></div>
        <div class="bg-shape triangle"></div>
        <div class="bg-shape triangle-reverse"></div>
        <div class="bg-shape triangle"></div>
        <div class="bg-shape triangle-reverse"></div>
        <div class="bg-shape triangle"></div>
        <div class="bg-shape triangle-reverse"></div>
    </div>

    <div class="page-container">
        <header class="page-header">
            <h1>misc</h1>
            <a href="index.html" class="home-btn"> ← home </a>
        </header>

        <div class="page-content two-column-layout">
            <!-- Left Column -->
            <div class="column left-column">
                <!-- Search: all-time Last.fm scrobbles -->
                <section class="search-section">
                    <div class="search-bar">
                        <h2>have i heard it?</h2>
                        <div class="search-field">
                            <input class="search-input" id="song-search" type="text" placeholder="search a song or artist"
                                autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"
                                aria-label="search my Last.fm scrobbles" aria-controls="song-results">
                            <div class="search-results" id="song-results" aria-live="polite"></div>
                        </div>
                    </div>
                </section>

                <!-- Top Artists This Month -->
                <section>
                    <h2>top artists this month</h2>
                    <div class="artists-row" id="artists-grid">
                        <p class="loading">Loading artists...</p>
                    </div>
                </section>

                <!-- Now Playing + Queue side-by-side -->
                <div class="np-queue-row">
                    <section class="np-section">
                        <h2 id="np-header">now playing</h2>
                        <div class="now-playing" id="now-playing">
                            <img class="album-art" id="album-art" src="" alt="Album art">
                            <div class="track-info">
                                <div class="track-name" id="track-name">Loading...</div>
                                <div class="artist-name" id="artist-name"></div>
                                <div class="progress-container" id="progress-container">
                                    <div class="progress-bar" id="progress-bar"></div>
                                </div>
                                <div class="progress-time" id="progress-time">
                                    <span id="progress-current">0:00</span>
                                    <span id="progress-duration">0:00</span>
                                </div>
                                <div class="play-status" id="play-status"></div>
                            </div>
                        </div>
                    </section>

                    <section class="queue-section">
                        <h2 id="queue-header">current queue</h2>
                        <div class="queue-list" id="queue-list">
                            <p class="loading">Loading queue...</p>
                        </div>
                    </section>
                </div>
            </div>

            <!-- Right Column -->
            <div class="column right-column">
                <!-- Search: Letterboxd diary -->
                <section class="search-section">
                    <div class="search-bar">
                        <h2>have i seen it?</h2>
                        <div class="search-field">
                            <input class="search-input" id="film-search" type="text" placeholder="search a film"
                                autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"
                                aria-label="search my Letterboxd diary" aria-controls="film-results">
                            <div class="search-results" id="film-results" aria-live="polite"></div>
                        </div>
                    </div>
                </section>

                <!-- Top 4 Films -->
                <section>
                    <h2>top 4</h2>
                    <div class="films-row" id="top4-grid">
                        <p class="loading">Loading top 4...</p>
                    </div>
                </section>

                <!-- Recently Watched -->
                <section>
                    <h2>recent films</h2>
                    <div class="films-row" id="films-grid">
                        <p class="loading">Loading films...</p>
                    </div>
                </section>
            </div>
        </div>

        <footer class="social-links">
            <a href="https://letterboxd.com/yerasaki" target="_blank">
                <img src="icons/letterboxd.svg" alt="Letterboxd">
                <span>Letterboxd</span>
            </a>
            <a href="https://open.spotify.com/user/kxs25fkegar1wmx32cu73jcye?si=95c3604f2e74483f" target="_blank">
                <img src="icons/spotify.svg" alt="Spotify">
                <span>Spotify</span>
            </a>
            <a href="https://www.last.fm/user/yerasaki" target="_blank">
                <img src="icons/lastfm.svg" alt="Last.fm">
                <span>Last.fm</span>
            </a>
            <a href="https://www.serializd.com/user/yerasaki/profile" target="_blank">
                <img src="icons/serializd.svg" alt="Serializd">
                <span>Serializd</span>
            </a>
        </footer>
    </div>

    <div id="mousetrailer"></div>

    <script src="frontend/subpage/subpage.js"></script>
    <script src="frontend/misc.js"></script>
</body>

</html>
